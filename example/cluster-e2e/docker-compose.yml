version: "3.9"
services:
  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0
    ports: ["8500:8500"]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 注意:cluster 形态刻意【不】用共享数据库。每个节点各自持有本地 sqlite
  # (见 config-node-*.yaml 的 dsn: /data/m7s.db),集群协调全部走 Consul。
  # 共享 DB 会触发 pull_proxy_configs 无节点归属列的问题:任一节点重启即加载
  # 全表 pull_on_start → 拉全网 + KV 属主冲突。详见 CLAUDE.md Known Issues。

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: m7sm7sm7s
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Auto-create bucket once minio is healthy.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set m http://minio:9000 admin m7sm7sm7s &&
        mc mb --ignore-existing m/m7s-records &&
        echo 'bucket ready'
      "

  node-1:
    build:
      context: ../..
      dockerfile: example/cluster-e2e/Dockerfile
    command: ["-c", "/app/config-node-1.yaml"]
    volumes:
      - ./config-node-1.yaml:/app/config-node-1.yaml:ro
      - node-1-data:/data
    ports:
      - "1935:1935"
      - "5541:554"
      - "8081:8080"
      - "50051:50051"
    depends_on:
      consul:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  node-2:
    build:
      context: ../..
      dockerfile: example/cluster-e2e/Dockerfile
    command: ["-c", "/app/config-node-2.yaml"]
    volumes:
      - ./config-node-2.yaml:/app/config-node-2.yaml:ro
      - node-2-data:/data
    ports:
      - "1936:1935"
      - "5542:554"
      - "8082:8080"
      - "50052:50051"
    depends_on:
      consul:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  node-3:
    build:
      context: ../..
      dockerfile: example/cluster-e2e/Dockerfile
    command: ["-c", "/app/config-node-3.yaml"]
    volumes:
      - ./config-node-3.yaml:/app/config-node-3.yaml:ro
      - node-3-data:/data
    ports:
      - "1937:1935"
      - "5543:554"
      - "8083:8080"
      - "50053:50051"
    depends_on:
      consul:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  node-1-data:
  node-2-data:
  node-3-data:
